server.port=8080

# Conexão com Azure SQL (valores vêm das variáveis de ambiente / App Settings)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Executa o ddl.sql (idempotente) na inicialização (o Hibernate não altera nem valida o schema)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:ddl.sql
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
